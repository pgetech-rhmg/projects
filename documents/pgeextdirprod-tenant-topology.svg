<svg xmlns="http://www.w3.org/2000/svg" width="1780" height="1380" viewBox="0 0 1780 1380" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrowExt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
    <marker id="arrowSso" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
    <style>
      .title    { font-size: 23px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-size: 16px; font-weight: 700; }
      .rglabel  { font-size: 14px; font-weight: 700; fill: #0f172a; }
      .res      { font-size: 12.5px; font-weight: 600; fill: #0f172a; }
      .grp      { font-size: 15px; font-weight: 700; fill: #312e81; }
      .small    { font-size: 11.5px; fill: #475569; }
      .legend   { font-size: 13px; fill: #334155; }
      .extlbl   { font-size: 13px; font-weight: 700; }
      .issue    { font-size: 15px; font-weight: 700; fill: #6d28d9; }
    </style>
  </defs>

  <rect x="0" y="0" width="1780" height="1380" fill="#ffffff"/>

  <!-- ===================== TENANT ===================== -->
  <rect x="470" y="70" width="940" height="1000" rx="14" fill="#f8fafc" stroke="#334155" stroke-width="2.5"/>
  <text x="940" y="104" text-anchor="middle" class="title">PGEEXTDIR &#8212; External Tenant (Microsoft Entra ID)</text>

  <!-- ============ Nonprod subscription ============ -->
  <rect x="500" y="126" width="880" height="572" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="518" y="151" class="subtitle" fill="#4338ca">Nonprod Subscription <tspan class="small" fill="#6366f1">(sub-veg-nonprod)</tspan></text>

  <!-- dev RG  (center y = 244) -->
  <rect x="530" y="170" width="820" height="148" rx="8" fill="#ffffff" stroke="#0d9488" stroke-width="2"/>
  <text x="550" y="192" class="rglabel">dev &#8212; resource group <tspan class="small">(rg-veg-dev)</tspan></text>
  <rect x="552" y="210" width="250" height="90" rx="6" fill="#faf5ff" stroke="#a855f7" stroke-width="1.4"/>
  <text x="677" y="246" text-anchor="middle" class="res">Additional Resources</text>
  <text x="677" y="265" text-anchor="middle" class="small">ACR, Postgres,</text>
  <text x="677" y="282" text-anchor="middle" class="small">App Gateway, ACS&#8230;</text>
  <rect x="822" y="210" width="240" height="90" rx="6" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.4"/>
  <text x="942" y="250" text-anchor="middle" class="res">Key Vault</text>
  <text x="942" y="269" text-anchor="middle" class="small">app secrets</text>
  <rect x="1082" y="210" width="248" height="90" rx="6" fill="#ecfeff" stroke="#06b6d4" stroke-width="1.6"/>
  <text x="1206" y="250" text-anchor="middle" class="res">Container App</text>
  <text x="1206" y="269" text-anchor="middle" class="small">backend service</text>

  <!-- qa RG  (center y = 424) -->
  <rect x="530" y="350" width="820" height="148" rx="8" fill="#ffffff" stroke="#0d9488" stroke-width="2"/>
  <text x="550" y="372" class="rglabel">qa &#8212; resource group <tspan class="small">(rg-veg-qa)</tspan></text>
  <rect x="552" y="390" width="250" height="90" rx="6" fill="#faf5ff" stroke="#a855f7" stroke-width="1.4"/>
  <text x="677" y="426" text-anchor="middle" class="res">Additional Resources</text>
  <text x="677" y="445" text-anchor="middle" class="small">ACR, Postgres,</text>
  <text x="677" y="462" text-anchor="middle" class="small">App Gateway, ACS&#8230;</text>
  <rect x="822" y="390" width="240" height="90" rx="6" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.4"/>
  <text x="942" y="430" text-anchor="middle" class="res">Key Vault</text>
  <text x="942" y="449" text-anchor="middle" class="small">app secrets</text>
  <rect x="1082" y="390" width="248" height="90" rx="6" fill="#ecfeff" stroke="#06b6d4" stroke-width="1.6"/>
  <text x="1206" y="430" text-anchor="middle" class="res">Container App</text>
  <text x="1206" y="449" text-anchor="middle" class="small">backend service</text>

  <!-- uat RG  (center y = 604) -->
  <rect x="530" y="530" width="820" height="148" rx="8" fill="#ffffff" stroke="#0d9488" stroke-width="2"/>
  <text x="550" y="552" class="rglabel">uat &#8212; resource group <tspan class="small">(rg-veg-uat)</tspan></text>
  <rect x="552" y="570" width="250" height="90" rx="6" fill="#faf5ff" stroke="#a855f7" stroke-width="1.4"/>
  <text x="677" y="606" text-anchor="middle" class="res">Additional Resources</text>
  <text x="677" y="625" text-anchor="middle" class="small">ACR, Postgres,</text>
  <text x="677" y="642" text-anchor="middle" class="small">App Gateway, ACS&#8230;</text>
  <rect x="822" y="570" width="240" height="90" rx="6" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.4"/>
  <text x="942" y="610" text-anchor="middle" class="res">Key Vault</text>
  <text x="942" y="629" text-anchor="middle" class="small">app secrets</text>
  <rect x="1082" y="570" width="248" height="90" rx="6" fill="#ecfeff" stroke="#06b6d4" stroke-width="1.6"/>
  <text x="1206" y="610" text-anchor="middle" class="res">Container App</text>
  <text x="1206" y="629" text-anchor="middle" class="small">backend service</text>

  <!-- ============ Prod subscription ============ -->
  <rect x="500" y="726" width="880" height="212" rx="10" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
  <text x="518" y="751" class="subtitle" fill="#c2410c">Prod Subscription <tspan class="small" fill="#f97316">(sub-veg-prod)</tspan></text>

  <!-- prod RG  (center y = 844) -->
  <rect x="530" y="770" width="820" height="148" rx="8" fill="#ffffff" stroke="#ea580c" stroke-width="2"/>
  <text x="550" y="792" class="rglabel">prod &#8212; resource group <tspan class="small">(rg-veg-prod)</tspan></text>
  <rect x="552" y="810" width="250" height="90" rx="6" fill="#faf5ff" stroke="#a855f7" stroke-width="1.4"/>
  <text x="677" y="846" text-anchor="middle" class="res">Additional Resources</text>
  <text x="677" y="865" text-anchor="middle" class="small">ACR, Postgres,</text>
  <text x="677" y="882" text-anchor="middle" class="small">App Gateway, ACS&#8230;</text>
  <rect x="822" y="810" width="240" height="90" rx="6" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.4"/>
  <text x="942" y="850" text-anchor="middle" class="res">Key Vault</text>
  <text x="942" y="869" text-anchor="middle" class="small">app secrets</text>
  <rect x="1082" y="810" width="248" height="90" rx="6" fill="#ecfeff" stroke="#06b6d4" stroke-width="1.6"/>
  <text x="1206" y="850" text-anchor="middle" class="res">Container App</text>
  <text x="1206" y="869" text-anchor="middle" class="small">backend service</text>

  <!-- ============ TENANT-WIDE SSO band (full width, below both subs) ============ -->
  <rect x="500" y="962" width="880" height="82" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2.5"/>
  <text x="524" y="998" class="issue">Entra ID SSO &#183; Identity Provider</text>
  <text x="524" y="1022" class="small" fill="#6d28d9">Tenant-wide &#8212; one per tenant, not per subscription or resource group. Federates sign-in to SaaS apps; access is gated by security-group membership.</text>

  <!-- ===================== IDENTITY (groups + users) ===================== -->
  <rect x="60" y="150" width="290" height="768" rx="14" fill="#f5f3ff" stroke="#4f46e5" stroke-width="2.5"/>
  <text x="205" y="180" text-anchor="middle" class="subtitle" fill="#4338ca">Entra ID Security Groups</text>

  <!-- dev group (center 244) -->
  <rect x="80" y="199" width="250" height="90" rx="9" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.8"/>
  <text x="95" y="227" class="grp">dev group</text>
  <text x="95" y="246" class="small" fill="#4f46e5">(EXT-VegetationMgt-Dev)</text>
  <circle cx="118" cy="269" r="8" fill="#4f46e5"/><circle cx="145" cy="269" r="8" fill="#4f46e5"/><circle cx="172" cy="269" r="8" fill="#4f46e5"/>
  <text x="200" y="274" class="small">members</text>

  <!-- qa group (center 424) -->
  <rect x="80" y="379" width="250" height="90" rx="9" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.8"/>
  <text x="95" y="407" class="grp">qa group</text>
  <text x="95" y="426" class="small" fill="#4f46e5">(EXT-VegetationMgt-QA)</text>
  <circle cx="118" cy="449" r="8" fill="#4f46e5"/><circle cx="145" cy="449" r="8" fill="#4f46e5"/><circle cx="172" cy="449" r="8" fill="#4f46e5"/>
  <text x="200" y="454" class="small">members</text>

  <!-- uat group (center 604) -->
  <rect x="80" y="559" width="250" height="90" rx="9" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.8"/>
  <text x="95" y="587" class="grp">uat group</text>
  <text x="95" y="606" class="small" fill="#4f46e5">(EXT-VegetationMgt-UAT)</text>
  <circle cx="118" cy="629" r="8" fill="#4f46e5"/><circle cx="145" cy="629" r="8" fill="#4f46e5"/><circle cx="172" cy="629" r="8" fill="#4f46e5"/>
  <text x="200" y="634" class="small">members</text>

  <!-- prod group (center 844) -->
  <rect x="80" y="799" width="250" height="90" rx="9" fill="#fff7ed" stroke="#ea580c" stroke-width="1.8"/>
  <text x="95" y="827" class="grp" fill="#9a3412">prod group</text>
  <text x="95" y="846" class="small" fill="#ea580c">(EXT-VegetationMgt-Prod)</text>
  <circle cx="118" cy="869" r="8" fill="#ea580c"/><circle cx="145" cy="869" r="8" fill="#ea580c"/><circle cx="172" cy="869" r="8" fill="#ea580c"/>
  <text x="200" y="874" class="small">members</text>

  <!-- ===================== RBAC LINES (straight, corridor x=350..528, at RG centers) ===================== -->
  <line x1="350" y1="244" x2="528" y2="244" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="350" y1="424" x2="528" y2="424" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="350" y1="604" x2="528" y2="604" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="350" y1="844" x2="528" y2="844" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="439" y="236" text-anchor="middle" class="small">RBAC</text>
  <text x="439" y="416" text-anchor="middle" class="small">RBAC</text>
  <text x="439" y="596" text-anchor="middle" class="small">RBAC</text>
  <text x="439" y="836" text-anchor="middle" class="small">RBAC</text>

  <!-- ===================== EXTERNAL BOX 1 — App outbound (top-right) ===================== -->
  <rect x="1470" y="145" width="250" height="220" rx="14" fill="#fffbeb" stroke="#b45309" stroke-width="2.5"/>
  <text x="1595" y="175" text-anchor="middle" class="extlbl" fill="#92400e">App outbound &#183; HTTPS</text>
  <text x="1595" y="195" text-anchor="middle" class="small">outside the subscription</text>
  <rect x="1490" y="212" width="210" height="60" rx="7" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
  <text x="1595" y="238" text-anchor="middle" class="res">Microsoft Graph API</text>
  <text x="1595" y="258" text-anchor="middle" class="small">user / group provisioning</text>
  <rect x="1490" y="284" width="210" height="60" rx="7" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
  <text x="1595" y="310" text-anchor="middle" class="res">Logz.io</text>
  <text x="1595" y="330" text-anchor="middle" class="small">log shipping</text>

  <!-- ===================== EXTERNAL BOX 2 — SSO-gated (bottom aligned with tenant box bottom, y=1070) ===================== -->
  <rect x="1470" y="850" width="250" height="220" rx="14" fill="#faf5ff" stroke="#7c3aed" stroke-width="2.5"/>
  <text x="1595" y="880" text-anchor="middle" class="extlbl" fill="#6d28d9">SSO-gated downstream apps</text>
  <text x="1595" y="900" text-anchor="middle" class="small">outside the subscription</text>
  <rect x="1490" y="917" width="210" height="60" rx="7" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="1595" y="943" text-anchor="middle" class="res">Salesforce Field Service</text>
  <text x="1595" y="963" text-anchor="middle" class="small">contractor access via SSO</text>
  <rect x="1490" y="989" width="210" height="60" rx="7" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="1595" y="1015" text-anchor="middle" class="res">Lemur Pro</text>
  <text x="1595" y="1035" text-anchor="middle" class="small">contractor access via SSO</text>

  <!-- ONE straight line: dev Container App (right edge 1330, cy 255) -> App outbound box (left edge 1470, cy 255). -->
  <line x1="1330" y1="255" x2="1468" y2="255" stroke="#b45309" stroke-width="2.5" marker-end="url(#arrowExt)"/>

  <!-- ONE line: tenant-wide SSO band (right edge 1380, cy 1003) -> SSO-gated box (left edge 1470, cy 960). -->
  <path d="M1380,1003 L1420,1003 L1420,960 L1468,960" fill="none" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#arrowSso)"/>

  <!-- ===================== LEGEND ===================== -->
  <rect x="60" y="1160" width="1660" height="150" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="80" y="1190" class="subtitle" fill="#0f172a">Legend</text>
  <line x1="85" y1="1220" x2="135" y2="1220" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="148" y="1225" class="legend">Each Entra ID security group is granted RBAC to the matching environment's resource group (dev&#8594;dev, qa&#8594;qa, uat&#8594;uat, prod&#8594;prod). Users inherit access via group membership. Every RG holds the same resource set.</text>
  <path d="M85,1252 L135,1252" fill="none" stroke="#b45309" stroke-width="2" marker-end="url(#arrowExt)"/>
  <text x="148" y="1257" class="legend">App outbound (HTTPS): each environment's Container App calls Microsoft Graph (user/group provisioning) and Logz.io (logs). Drawn once from dev to keep the diagram legible.</text>
  <path d="M85,1284 L135,1284" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrowSso)"/>
  <text x="148" y="1289" class="legend">Entra ID SSO is tenant-wide (one Identity Provider): it federates contractors into the downstream SaaS apps, authorized by the same group membership the app manages via Graph.</text>
</svg>
