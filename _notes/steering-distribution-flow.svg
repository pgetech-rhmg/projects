<text class="ts" x="395" y="346" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">@imports it</text>

<line x1="490" y1="335" x2="510" y2="335" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="510" y="300" width="130" height="70" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text class="th" x="575" y="326" text-anchor="middle" dominant-baseline="central" fill="#0C447C">CI guard</text>
<text class="ts" x="575" y="346" text-anchor="middle" dominant-baseline="central" fill="#185FA5">blocks drift</text>

<line x1="320" y1="408" x2="320" y2="424" stroke="#5F5E5A" stroke-width="1.5" fill="none"/>
<line x1="164" y1="424" x2="476" y2="424" stroke="#5F5E5A" stroke-width="1.5" fill="none"/>
<line x1="164" y1="424" x2="164" y2="440" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="320" y1="424" x2="320" y2="440" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="476" y1="424" x2="476" y2="440" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="96" y="440" width="136" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="th" x="164" y="462" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A">Claude Code</text>
<rect x="252" y="440" width="136" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="th" x="320" y="462" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A">Cursor</text>
<rect x="408" y="440" width="136" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="th" x="476" y="462" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A">Copilot</text>
</svg>
