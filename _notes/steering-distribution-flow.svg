<svg xmlns="http://www.w3.org/2000/svg" width="680" height="520" viewBox="0 0 680 520" role="img" aria-label="Steering document distribution architecture">
<style>
  .t{font-family:Arial,Helvetica,sans-serif;font-size:14px;font-weight:400}
  .th{font-family:Arial,Helvetica,sans-serif;font-size:14px;font-weight:500}
  .ts{font-family:Arial,Helvetica,sans-serif;font-size:12px;font-weight:400}
</style>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>
<rect x="0" y="0" width="680" height="520" fill="#ffffff"/>

<rect x="200" y="40" width="240" height="58" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text class="th" x="320" y="62" text-anchor="middle" dominant-baseline="central" fill="#3C3489">JFrog Artifactory</text>
<text class="ts" x="320" y="80" text-anchor="middle" dominant-baseline="central" fill="#534AB7">versioned steering package</text>

<line x1="320" y1="98" x2="320" y2="148" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="40" y="150" width="150" height="58" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="th" x="115" y="172" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A">repo manifest</text>
<text class="ts" x="115" y="190" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">pins version</text>

<line x1="190" y1="179" x2="200" y2="179" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="200" y="150" width="240" height="58" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="th" x="320" y="172" text-anchor="middle" dominant-baseline="central" fill="#085041">materialize step</text>
<text class="ts" x="320" y="190" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">pulls pinned version</text>

<line x1="320" y1="208" x2="320" y2="262" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="150" y="262" width="340" height="146" rx="12" fill="#F7F6F1" stroke="#C8C6BC" stroke-width="0.5"/>
