<rect x="170" y="300" width="130" height="70" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="th" x="235" y="326" text-anchor="middle" dominant-baseline="central" fill="#085041">steering/</text>
<text class="ts" x="235" y="346" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">materialized</text>

<line x1="300" y1="335" x2="330" y2="335" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="330" y="300" width="130" height="70" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
