jobs:
- job: DeployInfraJob
  displayName: "Deploy Infrastructure"
  pool:
    vmImage: ubuntu-latest

  workspace:
    clean: all

  steps:

    ###########################################################################
    # Download App Artifact
    ###########################################################################
    - task: DownloadPipelineArtifact@2
      displayName: "Download infrastructure code"
      inputs:
        artifactName: epic-app
        targetPath: $(System.DefaultWorkingDirectory)/${{ parameters.appName }}


    ###########################################################################
    # Install Terraform
    ###########################################################################
    - task: TerraformInstaller@1
      displayName: 'Install Terraform'
      inputs:
        terraformVersion: 'latest'


    ###########################################################################
    # Mint a GitHub token (App installation, PAT fallback) → $(GH_TOKEN)
    # No repo → resolve the org-level install for the module owner (github.com).
    ###########################################################################
    - template: /common/gh-app-token.yml
      parameters:
        owner: ${{ parameters.owner }}
        githubHost: "github.com"

    ###########################################################################
    # Configure Git Credentials for Terraform
    ###########################################################################
    - bash: |
        git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"
      displayName: 'Configure Git credentials for Terraform'
      env:
        GH_TOKEN: $(GH_TOKEN)


    ###########################################################################
    # Cloud-specific Infrastructure
    ###########################################################################
    - template: ${{ parameters.cloudProvider }}.yml
      parameters:
        ${{ insert }}: ${{ parameters }}
