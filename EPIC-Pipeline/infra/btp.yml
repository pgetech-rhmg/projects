steps:

  ###########################################################################
  # Read BTP Cloud Config
  ###########################################################################
  - bash: |
      set -euo pipefail

      CONFIG="$(System.DefaultWorkingDirectory)/${{ parameters.appName }}/${{ parameters.configPath }}/epic.json"

      echo ">> Reading BTP cloud config"

      AWS_ACCOUNT_ID=$(jq -r '.cloud.awsAccountId' "$CONFIG")
      AWS_REGION=$(jq -r '.cloud.awsRegion // "us-west-2"' "$CONFIG")
      SECRETS_MANAGER_NAME=$(jq -r '.cloud.secretsManager.name // empty' "$CONFIG")
      SECRETS_MANAGER_KEYS=$(jq -r '.cloud.secretsManager.keys // empty | join(",")' "$CONFIG")

      if [ -z "$AWS_ACCOUNT_ID" ] || [ "$AWS_ACCOUNT_ID" = "null" ]; then
        echo "##vso[task.logissue type=error]cloud.awsAccountId is required in epic.json"
        exit 1
      fi

      if [ -z "$SECRETS_MANAGER_NAME" ]; then
        echo "##vso[task.logissue type=error]cloud.secretsManager.name is required in epic.json"
        exit 1
      fi

      if [ -z "$SECRETS_MANAGER_KEYS" ]; then
        echo "##vso[task.logissue type=error]cloud.secretsManager.keys is required in epic.json"
        exit 1
      fi

      echo "##vso[task.setvariable variable=CLOUD_AWS_ACCOUNT_ID]$AWS_ACCOUNT_ID"
      echo "##vso[task.setvariable variable=CLOUD_AWS_REGION]$AWS_REGION"
      echo "##vso[task.setvariable variable=SECRETS_MANAGER_NAME]$SECRETS_MANAGER_NAME"
      echo "##vso[task.setvariable variable=SECRETS_MANAGER_KEYS]$SECRETS_MANAGER_KEYS"
    displayName: 'Read BTP cloud config'

  ###########################################################################
  # Assume Deployment Role
  ###########################################################################
  - task: AWSShellScript@1
    displayName: 'Assume Target Account Role'
    inputs:
      awsCredentials: 'AWS'
      regionName: $(CLOUD_AWS_REGION)
      scriptType: 'inline'
      inlineScript: |
        set -euo pipefail

        aws sts assume-role \
          --role-arn "arn:aws:iam::$(CLOUD_AWS_ACCOUNT_ID):role/pge-epic-deployment-role" \
          --role-session-name "epic-terraform-deploy" \
          --duration-seconds 3600 \
          --query 'Credentials.[AccessKeyId,SecretAccessKey,SessionToken]' \
          --output text \
        | while read -r key secret token; do
            echo "##vso[task.setvariable variable=AWS.AccessKeyID;issecret=true]$key"
            echo "##vso[task.setvariable variable=AWS.SecretAccessKey;issecret=true]$secret"
            echo "##vso[task.setvariable variable=AWS.SessionToken;issecret=true]$token"
          done

  ###########################################################################
  # Retrieve Secrets from AWS Secrets Manager
  ###########################################################################
  - task: AWSShellScript@1
    displayName: 'Retrieve BTP secrets'
    inputs:
      regionName: $(CLOUD_AWS_REGION)
      scriptType: 'inline'
      inlineScript: |
        set -euo pipefail

        echo ">> Retrieving secrets from: $(SECRETS_MANAGER_NAME)"

        SECRET_JSON=$(aws secretsmanager get-secret-value \
          --secret-id "$(SECRETS_MANAGER_NAME)" \
          --query 'SecretString' \
          --output text)

        : > $(Agent.TempDirectory)/btp-secrets.env

        IFS=',' read -ra KEYS <<< "$(SECRETS_MANAGER_KEYS)"
        for KEY in "${KEYS[@]}"; do
          VALUE=$(echo "$SECRET_JSON" | jq -r --arg k "$KEY" '.[$k] // empty')
          if [ -z "$VALUE" ]; then
            echo "##vso[task.logissue type=error]Key '$KEY' not found in secret $(SECRETS_MANAGER_NAME)"
            exit 1
          fi
          echo "export ${KEY}='${VALUE//\'/\'\\\'\'}'" >> $(Agent.TempDirectory)/btp-secrets.env
        done

        echo ">> All secrets retrieved successfully"

  ###########################################################################
  # Init
  ###########################################################################
  - task: AWSShellScript@1
    displayName: 'Terraform Init'
    inputs:
      regionName: $(CLOUD_AWS_REGION)
      scriptType: 'inline'
      inlineScript: |
        set -euo pipefail

        cd "$(System.DefaultWorkingDirectory)/${{ parameters.appName }}/${{ parameters.infraPath }}"

        source $(Agent.TempDirectory)/btp-secrets.env

        terraform init \
          -backend-config="bucket=pge-epic-tfstate" \
          -backend-config="use_lockfile=true" \
          -backend-config="key=$(CLOUD_AWS_ACCOUNT_ID)/${{ parameters.appName }}-${{ parameters.appType }}/${{ parameters.environment }}/terraform.tfstate" \
          -backend-config="region=$(CLOUD_AWS_REGION)" \
          -backend-config="encrypt=true"

  ###########################################################################
  # Format
  ###########################################################################
  - task: AWSShellScript@1
    displayName: 'Terraform Format'
    inputs:
      regionName: $(CLOUD_AWS_REGION)
      scriptType: 'inline'
      inlineScript: |
        set -euo pipefail

        cd "$(System.DefaultWorkingDirectory)/${{ parameters.appName }}/${{ parameters.infraPath }}"

        terraform fmt -recursive

  ###########################################################################
  # Validate
  ###########################################################################
  - task: AWSShellScript@1
    displayName: 'Terraform Validate'
    inputs:
      regionName: $(CLOUD_AWS_REGION)
      scriptType: 'inline'
      inlineScript: |
        set -euo pipefail

        cd "$(System.DefaultWorkingDirectory)/${{ parameters.appName }}/${{ parameters.infraPath }}"

        source $(Agent.TempDirectory)/btp-secrets.env

        terraform validate

  ###########################################################################
  # TFLint
  ###########################################################################
  - ${{ if and(eq(parameters.scan, 'true'), eq(parameters.terraformAction, 'apply')) }}:

    - task: AWSShellScript@1
      displayName: 'TFLint'
      inputs:
        regionName: $(CLOUD_AWS_REGION)
        scriptType: 'inline'
        inlineScript: |
          set -euo pipefail

          cd "$(System.DefaultWorkingDirectory)/${{ parameters.appName }}/${{ parameters.infraPath }}"

          curl -s https://raw.githubusercontent.com/terraform-linters/tflint/master/install_linux.sh | bash
          tflint --init
          tflint || true

  ###########################################################################
  # Test
  ###########################################################################
  - ${{ if and(eq(parameters.tests, 'true'), eq(parameters.terraformAction, 'apply')) }}:

    - task: AWSShellScript@1
      displayName: 'Terraform Test'
      inputs:
        regionName: $(CLOUD_AWS_REGION)
        scriptType: 'inline'
        inlineScript: |
          set -euo pipefail

          cd "$(System.DefaultWorkingDirectory)/${{ parameters.appName }}/${{ parameters.infraPath }}"

          source $(Agent.TempDirectory)/btp-secrets.env

          export TF_VAR_subaccount_name="${{ parameters.appName }}-$(date +%Y%m%d%H%M%S)"

          terraform test

  ###########################################################################
  # Apply
  ###########################################################################
  - ${{ if eq(parameters.terraformAction, 'apply') }}:

    - task: AWSShellScript@1
      displayName: 'Terraform Plan'
      inputs:
        regionName: $(CLOUD_AWS_REGION)
        scriptType: 'inline'
        inlineScript: |
          set -euo pipefail

          cd "$(System.DefaultWorkingDirectory)/${{ parameters.appName }}/${{ parameters.infraPath }}"

          source $(Agent.TempDirectory)/btp-secrets.env

          terraform plan \
            -input=false \
            -var-file="${{ parameters.appName }}.tfvars" \
            -out=tfplan

    - task: AWSShellScript@1
      displayName: 'Terraform Apply'
      inputs:
        regionName: $(CLOUD_AWS_REGION)
        scriptType: 'inline'
        inlineScript: |
          set -euo pipefail

          cd "$(System.DefaultWorkingDirectory)/${{ parameters.appName }}/${{ parameters.infraPath }}"

          source $(Agent.TempDirectory)/btp-secrets.env

          terraform apply -auto-approve tfplan

  ###########################################################################
  # Destroy
  ###########################################################################
  - ${{ if eq(parameters.terraformAction, 'destroy') }}:

    - task: AWSShellScript@1
      displayName: 'Terraform Plan Destroy'
      inputs:
        regionName: $(CLOUD_AWS_REGION)
        scriptType: 'inline'
        inlineScript: |
          set -euo pipefail

          cd "$(System.DefaultWorkingDirectory)/${{ parameters.appName }}/${{ parameters.infraPath }}"

          source $(Agent.TempDirectory)/btp-secrets.env

          terraform plan -destroy \
            -input=false \
            -var-file="${{ parameters.appName }}.tfvars" \
            -out=tfplan-destroy

    - task: AWSShellScript@1
      displayName: 'Terraform Destroy'
      inputs:
        regionName: $(CLOUD_AWS_REGION)
        scriptType: 'inline'
        inlineScript: |
          set -euo pipefail

          cd "$(System.DefaultWorkingDirectory)/${{ parameters.appName }}/${{ parameters.infraPath }}"

          source $(Agent.TempDirectory)/btp-secrets.env

          terraform apply -auto-approve tfplan-destroy
