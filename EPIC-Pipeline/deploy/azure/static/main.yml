###############################################################################
# Azure Static Website Deploy
#
# Uploads a built SPA (index.html + assets) to a Storage Account's implicit
# $web container (static-website hosting). Used for react/angular/html appTypes
# on Azure — the counterpart to the AWS S3+CloudFront static path.
#
# Storage account name resolution (nothing hardcoded):
#   1. Terraform outputs (frontend_storage_account), if a TF artifact exists
#   2. cloud.environments.<env>.staticStorageAccount (per-env override)
#   3. cloud.staticStorageAccount from epic.json (flat / single-env)
###############################################################################
steps:

  #############################################################################
  # Resolve target storage account
  #############################################################################
  - bash: |
      set -euo pipefail

      STORAGE_ACCOUNT=""

      # 1. Terraform outputs (when this app also ran a DeployInfra stage)
      if [ -f "${{ parameters.terraformOutputPath }}" ]; then
        STORAGE_ACCOUNT=$(jq -r '.frontend_storage_account.value // empty' "${{ parameters.terraformOutputPath }}")
      fi

      # 2/3. Fall back to epic.json — per-env override first, then the flat field.
      CONFIG="$(System.DefaultWorkingDirectory)/${{ parameters.appName }}/${{ parameters.configPath }}/epic.json"
      if [ -z "$STORAGE_ACCOUNT" ]; then
        STORAGE_ACCOUNT=$(jq -r --arg env "${{ parameters.environment }}" \
          '(.cloud.environments[$env].staticStorageAccount) // .cloud.staticStorageAccount // empty' "$CONFIG")
      fi

      if [ -z "$STORAGE_ACCOUNT" ]; then
        echo "##vso[task.logissue type=error]No static storage account found — set cloud.staticStorageAccount in epic.json or provide a frontend_storage_account Terraform output"
        exit 1
      fi

      echo "##vso[task.setvariable variable=STATIC_STORAGE_ACCOUNT]$STORAGE_ACCOUNT"
      echo ">> Static storage account: $STORAGE_ACCOUNT"
    displayName: "Resolve static storage account"


  #############################################################################
  # Runtime config injection (config.js)
  #
  # A SPA baked with build-time env vars can't serve multiple environments from
  # one build. If epic.json defines cloud.environments.<env>.appConfig, write it
  # as a config.js into the build output so the SPA reads per-env values at
  # RUNTIME (window.__APP_CONFIG__) — one build, any environment. The app is
  # expected to load /config.js before its bundle (see the app's index.html) and
  # fall back to its own defaults when this file is absent, so this step is a
  # no-op for apps that don't opt in (no appConfig key).
  #############################################################################
  - bash: |
      set -euo pipefail

      BUILD_PATH="$(System.DefaultWorkingDirectory)/${{ parameters.appName }}/${{ parameters.codePath }}/.build"
      CONFIG="$(System.DefaultWorkingDirectory)/${{ parameters.appName }}/${{ parameters.configPath }}/epic.json"

      # Per-env appConfig object (arbitrary key/values the SPA understands).
      APP_CONFIG=$(jq -c --arg env "${{ parameters.environment }}" \
        '(.cloud.environments[$env].appConfig) // .cloud.appConfig // empty' "$CONFIG")

      if [ -z "$APP_CONFIG" ] || [ "$APP_CONFIG" = "null" ]; then
        echo ">> No appConfig for env '${{ parameters.environment }}' — skipping config.js injection (app uses its bundled default)."
        exit 0
      fi

      echo ">> Writing runtime config.js for env '${{ parameters.environment }}': $APP_CONFIG"
      # Assigns window.__APP_CONFIG__; overwrites any default config.js shipped
      # in the build. jq emits valid JSON, which is valid JS object syntax.
      printf 'window.__APP_CONFIG__ = %s;\n' "$APP_CONFIG" > "$BUILD_PATH/config.js"
    displayName: "Inject runtime config.js"


  #############################################################################
  # Upload build output to $web
  #############################################################################
  - task: AzureCLI@2
    displayName: "Upload ${{ parameters.appType }} to the $web container"
    inputs:
      azureSubscription: ${{ parameters.azureServiceConnection }}
      scriptType: 'bash'
      scriptLocation: 'inlineScript'
      inlineScript: |
        set -euo pipefail

        BUILD_PATH="$(System.DefaultWorkingDirectory)/${{ parameters.appName }}/${{ parameters.codePath }}/.build"

        if [ ! -d "$BUILD_PATH" ]; then
          echo "##vso[task.logissue type=error]Build output not found at $BUILD_PATH"
          exit 1
        fi

        echo ">> Uploading $BUILD_PATH -> \$web of $(STATIC_STORAGE_ACCOUNT)"

        # --overwrite refreshes changed files; the $web container serves the SPA.
        az storage blob upload-batch \
          --account-name "$(STATIC_STORAGE_ACCOUNT)" \
          --auth-mode login \
          --destination '$web' \
          --source "$BUILD_PATH" \
          --overwrite true
