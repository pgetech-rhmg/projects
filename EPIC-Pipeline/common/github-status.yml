###############################################################################
# Reusable job: POST a GitHub commit status.
#
# Posts a single rollup "EPIC" status to a commit via the GitHub Commit Status
# API so branch protection can require it and gate PR merges. Called from the
# engine's Report* stages on webhook-push (CI) runs only.
#
# Auth uses the same GITHUB_PAT / ORG as the download job (GV-account-access
# variable group). The PAT needs the repo:status scope.
###############################################################################
parameters:
  - name: repo
    type: string
    default: ""
  - name: owner
    type: string
    default: "pgetech"
  - name: githubHost
    type: string
    default: "github.com"
  - name: commitSha
    type: string
    default: ""
  - name: state
    type: string
    default: "pending"    # pending | success | failure | error
  - name: description
    type: string
    default: ""

jobs:
  - job: GitHubStatus
    displayName: "Post GitHub status (${{ parameters.state }})"
    pool:
      vmImage: ubuntu-latest
    steps:
      - bash: |
          set -euo pipefail

          SHA="${{ parameters.commitSha }}"
          REPO="${{ parameters.repo }}"
          OWNER="${{ parameters.owner }}"
          HOST="${{ parameters.githubHost }}"

          if [[ -z "$SHA" || -z "$REPO" ]]; then
            echo ">> No commitSha/repo — skipping GitHub status"
            exit 0
          fi

          # Public GitHub's REST API is api.github.com; GitHub Enterprise is
          # https://<host>/api/v3. Derive the API base from the host.
          if [[ "$HOST" == "github.com" ]]; then
            API_BASE="https://api.github.com"
          else
            API_BASE="https://${HOST}/api/v3"
          fi

          # Link the status back to this ADO engine run.
          TARGET_URL="$(System.CollectionUri)$(System.TeamProject)/_build/results?buildId=$(Build.BuildId)&view=results"

          echo ">> Posting '${{ parameters.state }}' status to ${OWNER}/${REPO}@${SHA}"

          BODY=$(jq -n \
            --arg state "${{ parameters.state }}" \
            --arg target_url "$TARGET_URL" \
            --arg description "${{ parameters.description }}" \
            '{
              state: $state,
              target_url: $target_url,
              description: $description,
              context: "EPIC"
            }')

          HTTP_CODE=$(curl -sS -o /tmp/gh-status-resp.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${GITHUB_PAT}" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            -d "$BODY" \
            "${API_BASE}/repos/${OWNER}/${REPO}/statuses/${SHA}")

          echo ">> GitHub responded HTTP $HTTP_CODE"
          cat /tmp/gh-status-resp.json

          # 201 Created = status posted. Anything else is a real failure worth
          # surfacing — but only fail the build on the pending post, so a broken
          # PAT is caught early without masking the actual pipeline result on the
          # success/failure posts.
          if [ "$HTTP_CODE" != "201" ]; then
            echo "!! Failed to post GitHub status (HTTP $HTTP_CODE)"
            if [ "${{ parameters.state }}" == "pending" ]; then
              exit 1
            fi
          fi
        displayName: "POST commit status to GitHub"
        env:
          GITHUB_PAT: $(GITHUB_PAT)
