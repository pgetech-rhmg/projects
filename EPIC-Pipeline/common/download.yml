parameters:
  repo: ""
  owner: "pgetech"
  githubHost: "github.com"
  branch: ""

jobs:
- job: DownloadJob
  displayName: "Download App"
  pool:
    vmImage: ubuntu-latest
  
  workspace:
    clean: all

  #############################################################################
  # Steps
  #############################################################################
  steps:

    ###########################################################################
    # Mint a GitHub token (App installation, PAT fallback) → $(GH_TOKEN)
    ###########################################################################
    - template: /common/gh-app-token.yml
      parameters:
        owner: ${{ parameters.owner }}
        repo: ${{ parameters.repo }}
        githubHost: ${{ parameters.githubHost }}

    ###########################################################################
    # Download App
    ###########################################################################
    - bash: |
        set -euo pipefail

        echo ">> Downloading app: ${{ parameters.repo }}"
        echo ">> Branch: ${{ parameters.branch }}"
        echo ""

        mkdir app
        cd app

        git clone --branch "${{ parameters.branch }}" "https://x-access-token:${GH_TOKEN}@${{ parameters.githubHost }}/${{ parameters.owner }}/${{ parameters.repo }}.git" .

        echo ""
        echo ">> App downloaded"

      displayName: "Clone app from Github"
      env:
        GH_TOKEN: $(GH_TOKEN)


    ###########################################################################
    # Remove Symlinks
    ###########################################################################
    - bash: |
        set -euo pipefail

        cd "$(System.DefaultWorkingDirectory)/app"

        find . -type l -delete

      displayName: "Remove symlinks"


    ###########################################################################
    # Publish App Artifact
    ###########################################################################
    - task: PublishPipelineArtifact@1
      displayName: "Publish app artifact"
      inputs:
        targetPath: "$(System.DefaultWorkingDirectory)/app"
        artifact: "epic-app"
        publishLocation: "pipeline"
