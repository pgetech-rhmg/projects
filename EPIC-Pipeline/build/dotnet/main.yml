###############################################################################
# Steps
###############################################################################
steps:

  #############################################################################
  # Prepare SonarQube (if applicable)
  #############################################################################
  - ${{ if and(eq(parameters.scan, 'true'), eq(parameters.scanTool, 'sonarqube')) }}:
    - template: /scan/sonarqube/prepare.yml
      parameters:
        repo: ${{ parameters.repo }}
        branch: ${{ parameters.branch }}
        appName: ${{ parameters.appName }}
        appType: ${{ parameters.appType }}
        codePath: ${{ parameters.codePath }}
        buildTestTool: ${{ parameters.buildTestTool }}


  #############################################################################
  # Use .NET SDK Version
  #############################################################################
  - task: UseDotNet@2
    displayName: "Use .NET SDK ${{ coalesce(parameters.runtimeVersion, parameters.defaultRuntimeVersion) }}"
    inputs:
      packageType: "sdk"
      version: "${{ coalesce(parameters.runtimeVersion, parameters.defaultRuntimeVersion) }}"
      installationPath: $(Agent.ToolsDirectory)/dotnet


  #############################################################################
  # Verify .NET
  #############################################################################
  - bash: |
      set -euo pipefail

      dotnet --version
      dotnet --info
    displayName: "Verify .NET SDK"


  # #############################################################################
  # # Configure NuGet registry
  # #############################################################################
  # - bash: |
  #     set -euo pipefail

  #     PROJECT_DIR="$(System.DefaultWorkingDirectory)/${{ parameters.appName }}/${{ parameters.codePath }}"

  #     cat > "$PROJECT_DIR/nuget.config" <<EOF
  #     <?xml version="1.0" encoding="utf-8"?>
  #     <configuration>
  #       <packageSources>
  #         <clear />
  #         <add key="JFrog" value="https://jfrog.io.pge.com/artifactory/ccoe-cicd-prod-nuget-virtual/index.json" />
  #       </packageSources>
  #     </configuration>
  #     EOF

  #     echo ">> nuget.config written"
  #   displayName: "Configure NuGet registry"


  # #############################################################################
  # # Authenticate with JFrog NuGet
  # #############################################################################
  # - task: NuGetAuthenticate@1
  #   displayName: "Authenticate with JFrog NuGet"
  #   inputs:
  #     nuGetServiceConnections: "JFrog"


  #############################################################################
  # Restore
  #############################################################################
  - bash: |
      set -euo pipefail

      cd "$(System.DefaultWorkingDirectory)/${{ parameters.appName }}/${{ parameters.codePath }}"

      echo ">> Restoring packages"
      dotnet restore
    displayName: "Restore packages"


  #############################################################################
  # Build
  #############################################################################
  - bash: |
      set -euo pipefail

      cd "$(System.DefaultWorkingDirectory)/${{ parameters.appName }}/${{ parameters.codePath }}"

      echo ">> Building project"
      dotnet build --configuration Release --no-restore
    displayName: "Build project"


  #############################################################################
  # Publish or Pack (based on buildType)
  #############################################################################
  - bash: |
      set -euo pipefail

      PROJECT_DIR="$(System.DefaultWorkingDirectory)/${{ parameters.appName }}/${{ parameters.codePath }}"
      BUILD_TYPE="${{ parameters.buildType }}"

      cd "$PROJECT_DIR"

      rm -rf .build
      mkdir -p .build

      echo ">> Build Type: $BUILD_TYPE"

      if [[ "$BUILD_TYPE" == "nuget" ]]; then

        echo ">> Packing NuGet package"

        dotnet pack \
          --configuration Release \
          --no-build \
          --output "$PROJECT_DIR/.build"

      else

        echo ">> Publishing application"

        dotnet publish -c Release \
          -r linux-x64 \
          --self-contained true \
          -p:PublishSingleFile=true \
          -p:IncludeNativeLibrariesForSelfExtract=true \
          -o "$PROJECT_DIR/.build"

      fi

      echo ">> Output written to .build"
    displayName: "Publish or Pack"




  ###########################################################################
  # Scan Artifact
  ###########################################################################
  - ${{ if and(eq(parameters.scan, 'true'), eq(parameters.scanTool, 'sonarqube')) }}:

    #########################################################################
    # Copy scan results
    #########################################################################
    - bash: |
        set -euo pipefail

        cd "$(System.DefaultWorkingDirectory)/${{ parameters.appName }}/${{ parameters.codePath }}"

        rm -rf .scan
        mkdir -p .scan

        # The SonarScanner-for-.NET "begin" output (.sonarqube dir) produced during
        # prepare+build is what the Scan stage's analyze step consumes — always copy it.
        cp -R "$(Pipeline.Workspace)/.sonarqube/." .scan/

        # Plus every project's compiled bin/ and obj/ so the analyzer can resolve
        # assemblies. NOTE: the previous `cp -R **/bin/. .scan/` was broken — bash's
        # `**` is NOT recursive unless `globstar` is set (off by default), so it
        # matched nothing and `set -e` killed the step ("cannot stat '**/bin/.'").
        # `find` is recursive, works regardless of shell options, and tolerates a
        # project whose bin/obj live at the top level or nested. Relative paths are
        # preserved so multi-project solutions don't collide.
        find . -type d \( -name bin -o -name obj \) -not -path './.scan/*' -print0 \
          | while IFS= read -r -d '' dir; do
              mkdir -p ".scan/$dir"
              cp -R "$dir/." ".scan/$dir/"
            done
      displayName: "Copy scan artifacts"


    #########################################################################
    # Publish Scan Artifact
    #########################################################################
    - task: PublishPipelineArtifact@1
      displayName: "Publish scan artifact"
      inputs:
        targetPath: "$(System.DefaultWorkingDirectory)/${{ parameters.appName }}/${{ parameters.codePath }}/.scan"
        artifact: "epic-scan"
        publishLocation: "pipeline"
