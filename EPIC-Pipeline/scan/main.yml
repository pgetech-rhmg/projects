jobs:
- job: ScanJob
  displayName: "Scan App"
  pool:
    ${{ if or(eq(parameters.scanTool, 'sonarqube'), eq(parameters.scanTool, 'wiz')) }}:
      name: EPIC - Self-hosted
    ${{ if and(ne(parameters.scanTool, 'sonarqube'), ne(parameters.scanTool, 'wiz')) }}:
      vmImage: ubuntu-latest

  workspace:
    clean: all

  #############################################################################
  # Steps
  #############################################################################
  steps:

    ###########################################################################
    # Guard: .NET SonarQube scan requires a build
    #
    # SonarQube analyzes .NET in MSBuild (dotnet) mode — analysis is a byproduct
    # of the compile, and the instrumentation output is handed to the Scan stage
    # via the 'epic-scan' artifact published by the Build stage. With build off
    # that artifact never exists, so a "scan only" .NET run cannot work. Fail
    # fast with a clear message instead of the cryptic "epic-scan not found".
    ###########################################################################
    - ${{ if and(eq(parameters.scanTool, 'sonarqube'), or(eq(parameters.appType, 'dotnet'), eq(parameters.appType, 'dotnet_framework')), ne(parameters.build, 'true')) }}:
      - bash: |
          echo "SonarQube cannot analyze a .NET app without a build."
          echo "The .NET scanner instruments the compile, and the Scan stage"
          echo "consumes the 'epic-scan' artifact produced by the Build stage."
          echo "Re-run this pipeline with Build enabled."
          exit 1
        displayName: ".NET scan requires build"


    ###########################################################################
    # Download App Artifact
    ###########################################################################
    - task: DownloadPipelineArtifact@2
      displayName: "Download app artifact"
      inputs:
        artifactName: epic-app
        targetPath: $(System.DefaultWorkingDirectory)/${{ parameters.appName}}


    ###########################################################################
    # Download Test Artifact (coverage for SonarQube)
    #
    # The test artifact only feeds code coverage into SonarQube; Wiz never uses
    # it. It is only published when build tests actually run (see the BuildTest
    # stage guard in epic-engine.yml). So download it only when SonarQube is the
    # tool AND tests ran with a buildTestTool — otherwise the artifact does not
    # exist and the scan should still proceed (just without coverage).
    ###########################################################################
    - ${{ if and(eq(parameters.scanTool, 'sonarqube'), eq(parameters.tests, 'true'), ne(parameters.buildTestTool, '')) }}:
      - task: DownloadPipelineArtifact@2
        displayName: "Download test artifact"
        continueOnError: true
        inputs:
          artifactName: epic-build-tests
          targetPath: $(System.DefaultWorkingDirectory)/${{ parameters.appName }}/${{ parameters.codePath }}/.reports


    ###########################################################################
    # SonarQube
    ###########################################################################
    - ${{ if eq(parameters.scanTool, 'sonarqube') }}:
    
      # Coverage normalization only makes sense when build tests actually ran
      # and produced a coverage.xml. On a scan-only run (tests off) the report
      # never exists, so skip normalize — matching the test-artifact download
      # guard above and prepare.yml zeroing out the coverage properties.
      - ${{ if and(or(eq(parameters.appType, 'dotnet'), eq(parameters.appType, 'dotnet_framework')), eq(parameters.tests, 'true'), ne(parameters.buildTestTool, '')) }}:
        #######################################################################
        # Normalize Coverage File
        #######################################################################
        - template: sonarqube/normalize.yml
          parameters:
            ${{ insert }}: ${{ parameters }}


      #######################################################################
      # Prepare
      #######################################################################
      - template: sonarqube/prepare.yml
        parameters:
          ${{ insert }}: ${{ parameters }}


      - ${{ if or(eq(parameters.appType, 'dotnet'), eq(parameters.appType, 'dotnet_framework')) }}:
        #######################################################################
        # Download Scan Artifact
        #######################################################################
        - task: DownloadPipelineArtifact@2
          displayName: "Download scan artifact"
          inputs:
            artifactName: epic-scan
            targetPath: $(Pipeline.Workspace)/.sonarqube


      #########################################################################
      # Scan
      #########################################################################
      - template: sonarqube/scan.yml


    ###########################################################################
    # Wiz
    ###########################################################################
    - ${{ if eq(parameters.scanTool, 'wiz') }}:

      - template: wiz/main.yml
        parameters:
          ${{ insert }}: ${{ parameters }}
